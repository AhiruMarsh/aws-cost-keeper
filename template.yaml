AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: notify-aws-cost

Parameters:
  ProjectName:
    Type: String
    Default: notify-aws-cost
  DiscordWebhookURL:
    Type: String

Globals:
  Function:
    Timeout: 10

Resources:
  Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref ProjectName
      Description: !Ref ProjectName 
      CodeUri: app/
      Handler: main.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Variables:
        AWS_BUDGET_NAME: !Ref Budget
        DISCORD_WEBHOOK_URL: !Ref DiscordWebhookURL
      Policies:
        - AWSBillingReadOnlyAccess
      Events:
        Events:
          Type: Schedule
          Properties:
            Schedule: cron(5 0 * * ? *)
            Name: !Sub "${ProjectName}-Schedule"
            Enabled: True
      PropagateTags: true

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Function}"
      RetentionInDays: 30

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-CostBudget"
        BudgetType: COST
        TimeUnit: MONTHLY
